<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e199"/>
      <stop offset="35%" stop-color="#dfbe65"/>
      <stop offset="70%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#9a7b2c"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8933b"/>
      <stop offset="50%" stop-color="#f3dc8f"/>
      <stop offset="100%" stop-color="#cfad51"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="400" height="400" rx="30" fill="transparent"/>

  <!-- Logo Mark Group -->
  <g transform="translate(200, 205)" filter="url(#softGlow)">
    <!-- Crown / Diamond Top Crest -->
    <path d="M -55,-95 L -32,-60 L 0,-85 L 32,-60 L 55,-95 L 42,-50 L -42,-50 Z"
          fill="url(#goldGrad)" opacity="0.95" />
    <!-- Center Jewel Accent -->
    <polygon points="0,-78 -14,-52 0,-38 14,-52" fill="url(#goldAccent)"/>

    <!-- Left Cusp & Root -->
    <path d="M -10,-42 C -45,-42 -85,-18 -85,30 C -85,75 -50,115 -35,130 C -25,140 -12,120 -15,95 C -18,70 -35,45 -35,20 C -35,-10 -15,-25 -5,-30 Z"
          fill="url(#goldGrad)" />

    <!-- Right Cusp & Root -->
    <path d="M 10,-42 C 45,-42 85,-18 85,30 C 85,75 50,115 35,130 C 25,140 12,120 15,95 C 18,70 35,45 35,20 C 35,-10 15,-25 5,-30 Z"
          fill="url(#goldGrad)" />

    <!-- Center Diamond Core -->
    <path d="M 0,-24 L 14,0 L 0,42 L -14,0 Z" fill="url(#goldAccent)" opacity="0.9" />
    <circle cx="0" cy="62" r="3.5" fill="#f7e199"/>
    <circle cx="0" cy="76" r="2.5" fill="#dfbe65"/>
  </g>
</svg>
